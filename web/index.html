<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Martian Mappers — Mars EVA Planner</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/",
        "three/examples/jsm/": "../node_modules/three/examples/jsm/",
        "three-mesh-bvh": "../node_modules/three-mesh-bvh/build/index.module.js",
        "postprocessing": "../node_modules/postprocessing/build/index.js",
        "n8ao": "../node_modules/n8ao/dist/N8AO.js",
        "3d-tiles-renderer/core": "../node_modules/3d-tiles-renderer/build/index.core.js",
        "astronomy-engine": "../node_modules/astronomy-engine/esm/astronomy.js",
        "zod": "../node_modules/zod/index.js",
        "detect-gpu": "../node_modules/detect-gpu/dist/detect-gpu.esm.js",
        "mitt": "../node_modules/mitt/dist/mitt.mjs"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">MARTIAN MAPPERS</span>
      <span class="brand-sub">Mars EVA planner</span>
      <span id="badge-demo" class="pill" hidden>OFFLINE DATA</span>
    </div>
    <nav class="tabs" aria-label="Views">
      <button class="tab active" data-view="plan" type="button">Plan</button>
      <button class="tab" data-view="globe" type="button">Globe</button>
      <button class="tab" data-view="rehearse" type="button">Rehearse 3D</button>
    </nav>
    <div class="topbar-actions">
      <button id="btn-sources" class="btn" type="button">Sources &amp; limits</button>
      <button id="btn-settings" class="btn" type="button">Graphics</button>
    </div>
  </header>
  <div id="spacewx" class="spacewx" hidden></div>

  <main class="app-shell">
    <section id="plan-view" class="view active" aria-label="Mission planner"></section>

    <section id="orbit-view" class="view" aria-label="Mars globe">
      <div id="orbit-canvas-wrap" class="orbit-canvas-wrap"></div>
      <div id="orbit-labels" class="orbit-labels" aria-hidden="true"></div>
      <div id="orbit-loading" class="loading-veil">Loading Mars globe · Viking MDIM 2.1</div>
      <div class="orbit-hud orbit-hud-tl">
        <div class="orbit-title">MARS GLOBE</div>
        <div id="orbit-time" class="orbit-line">—</div>
        <div id="orbit-subsolar" class="orbit-line dim">—</div>
        <div id="orbit-moons" class="orbit-line dim">—</div>
      </div>
      <div class="orbit-hud orbit-hud-tr">
        <div class="orbit-btn-row">
          <button id="orbit-layer" class="btn" type="button">Layer: Viking colour</button>
          <button id="orbit-home" class="btn" type="button">Current plan</button>
        </div>
        <div class="orbit-btn-row">
          <span class="orbit-k">TIME</span>
          <button class="btn orbit-warp active" type="button" data-warp="1">Live</button>
          <button class="btn orbit-warp" type="button" data-warp="600">×600</button>
          <button class="btn orbit-warp" type="button" data-warp="6000">×6000</button>
        </div>
      </div>
      <div id="orbit-hover" class="orbit-hud orbit-hover">Drag to rotate · scroll to zoom · click the surface to plan there</div>
      <div id="orbit-confirm" class="orbit-confirm" hidden>
        <div class="orbit-confirm-title" id="orbit-confirm-title">SITE</div>
        <div class="orbit-confirm-meta" id="orbit-confirm-meta">—</div>
        <label class="orbit-confirm-sun" hidden><input type="checkbox" id="orbit-confirm-local" checked /> local time</label>
        <div class="orbit-confirm-actions">
          <button id="orbit-confirm-go" class="btn primary" type="button">Plan here</button>
          <button id="orbit-confirm-cancel" class="btn" type="button">Cancel</button>
        </div>
      </div>
      <div id="orbit-descent" class="orbit-descent" aria-hidden="true" hidden>
        <div class="orbit-descent-alt" id="orbit-descent-alt"></div>
      </div>
    </section>

    <section id="rehearse-view" class="view" aria-label="3D route rehearsal"></section>
  </main>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">Details</h2>
        <button id="modal-close" class="btn" type="button">Close</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
